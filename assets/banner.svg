<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: url(#titleGrad); }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #f8fafc; }
    
    @keyframes float1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(2deg); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(12px) rotate(-2deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }

    .node1 { animation: float1 6s ease-in-out infinite; }
    .node2 { animation: float2 8s ease-in-out infinite; }
    .bg-pulse { animation: pulse 4s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="350" rx="16" fill="url(#bgGrad)" />
  
  <!-- Animated Background Orbs (Behind content) -->
  <circle cx="150" cy="80" r="120" fill="#38bdf8" opacity="0.15" class="bg-pulse" />
  <circle cx="1050" cy="280" r="150" fill="#818cf8" opacity="0.15" class="bg-pulse" />

  <!-- Flow Lines / Grid in background -->
  <path d="M 0,220 Q 300,180 600,240 T 1200,200" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.2" />
  <path d="M 0,260 Q 400,280 800,220 T 1200,280" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.2" />

  <!-- Animated Decorative Floating Cards (Positioned safely to sides/bottom) -->
  <g class="node1" transform="translate(880, 50)">
    <rect width="240" height="70" rx="12" fill="#1e293b" opacity="0.9" stroke="#38bdf8" stroke-width="1" />
    <text x="20" y="42" class="badge-text" fill="#38bdf8">⚡ React &amp; Next.js Cloud</text>
  </g>

  <g class="node2" transform="translate(920, 150)">
    <rect width="220" height="70" rx="12" fill="#1e293b" opacity="0.9" stroke="#818cf8" stroke-width="1" />
    <text x="20" y="42" class="badge-text" fill="#818cf8">🟢 Supabase &amp; BaaS</text>
  </g>

  <g class="node1" transform="translate(850, 240)">
    <rect width="260" height="70" rx="12" fill="#1e293b" opacity="0.9" stroke="#c084fc" stroke-width="1" />
    <text x="20" y="42" class="badge-text" fill="#c084fc">📱 Mobile &amp; Flutter Backends</text>
  </g>

  <!-- Foreground Title and Subtitle (Guaranteed clear visibility) -->
  <g transform="translate(60, 130)">
    <text x="0" y="0" class="title" filter="url(#glow)">Awesome Frontend Web &amp; Mobile</text>
    <text x="0" y="50" class="title" filter="url(#glow)">Development Platform 🚀</text>
    <text x="0" y="105" class="subtitle">Curated BaaS Platforms, Serverless Frameworks &amp; Cloud Deployment Infrastructure</text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="60" y="285" width="400" height="4" rx="2" fill="url(#titleGrad)" />
</svg>
